{% extends 'main.html' %}
{% load static %}

{% block extra_head %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { display: flex; flex-direction: column; min-height: 100vh; }
        main { flex: 1; }
        .navbar-brand { font-weight: 700; font-size: 1.5rem; }
        footer { font-size: 0.85rem; }
    </style>
{% endblock %}

{% block content %}
<header>
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
        <div class="container">
            <a class="navbar-brand text-primary" href="{% url 'authentification:accueil' %}">UniShare</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="{% url 'authentification:accueil' %}">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'authentification:contact' %}">Contact</a></li>

                    <li class="nav-item ms-lg-3">
                        <a class="btn btn-outline-primary rounded-pill px-4" href="{% url 'authentification:connexion' %}">
                            Se connecter
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<main class="container py-5">
    {% block main_content %}{% endblock %}
</main>

<footer class="bg-light py-4 mt-auto">
    <div class="container text-center text-muted">
        <p class="mb-1">&copy; 2026 UniShare. All rights reserved.</p>
        <a href="{% url 'administrateur:admin_login' %}" class="text-decoration-none text-secondary">Espace Administration</a>
    </div>
</footer>
{% endblock %}
