{% extends "main.html" %}
{% load static %}

{% block title %}{{ action }} Enseignant{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
{% endblock %}

{% block content %}

<div class="form-card">

    <h2>{{ action }} un enseignant</h2>

    <form method="post">
        {% csrf_token %}

        <p class="section-label">
            Informations personnelles
        </p>

        <div class="row">
            <div class="col-6">
                <label class="form-label" for="nom">
                    Nom
                </label>

                <input
                    type="text"
                    id="nom"
                    name="nom"
                    class="form-control"
                    value="{{ form.nom.value|default:'' }}"
                    required
                >
            </div>

            <div class="col-6">
                <label class="form-label" for="prenom">
                    Prénom
                </label>

                <input
                    type="text"
                    id="prenom"
                    name="prenom"
                    class="form-control"
                    value="{{ form.prenom.value|default:'' }}"
                    required
                >
            </div>
        </div>

        <label class="form-label" for="telephone">
            Téléphone
        </label>

        <input
            type="text"
            id="telephone"
            name="telephone"
            class="form-control"
            value="{{ form.telephone.value|default:'' }}"
        >

        <p class="section-label">
            Compte utilisateur
        </p>

        <label class="form-label" for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            class="form-control"
            value="{{ form.email.value|default:'' }}"
            required
        >

        <label class="form-label" for="password">
            Mot de passe
        </label>

        <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            placeholder="••••••••"
            {% if action == 'Ajouter' %}required{% endif %}
        >

        <div class="checkbox-container">
            <input
                type="checkbox"
                id="est_responsable"
                name="est_responsable"
                {% if form.est_responsable.value %}checked{% endif %}
            >

            <label for="est_responsable">
                Définir comme enseignant responsable
            </label>
        </div>

        <div class="form-actions">

            <button type="submit" class="btn-submit">
                Enregistrer
            </button>

            <a href="{% url 'administrateur:admin_enseignants' %}"
               class="btn-annuler">
                Annuler
            </a>

        </div>

    </form>

</div>

{% endblock %}
